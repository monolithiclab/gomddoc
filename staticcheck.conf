# staticcheck's default is "all" minus the seven ST checks below. This file
# exists to put ST1000 back: 20 of the 22 packages had no package comment, and
# nothing in `make lint` could tell, because the one linter that already checks
# it ships with the check off.
#
# The other six stay off deliberately. ST1003 (initialisms and naming) and
# ST1016 (consistent receiver names) are churn on a codebase this far along.
# ST1020/ST1021/ST1022 enforce the "Foo does..." opening form on every exported
# symbol, which buys nothing here — the comments exist, and the form rule would
# rewrite them into worse sentences. ST1023 duplicates a fix `make codefix`
# already applies.
#
# Adding a check to this list is fine. Removing ST1000 is not, without also
# removing the package comments it now guards.
checks = ["all", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022", "-ST1023"]
