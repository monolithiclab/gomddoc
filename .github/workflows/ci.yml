name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only, workflow-wide: nothing here publishes anything, and a job added later inherits the floor.
permissions:
  contents: read

jobs:
  # The gate is exactly `make ci`, the same command run locally before every commit. It includes
  # lint-vulncheck (govulncheck needs network) and runs once per OS; accepted redundancy for reusing
  # setup-go's cache.
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go version
      # The front-end suite (`make test-ui`, inside `make ci`) needs Node and runs Playwright on the
      # runner's preinstalled Chrome. .cache/test-ui.sha records the inputs of the last green run, so
      # an unchanged front end skips the suite; the cache key is the hash test-ui itself computes.
      - if: matrix.os == 'ubuntu-latest'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - if: matrix.os == 'ubuntu-latest'
        id: ui-inputs
        run: echo "hash=$(make --no-print-directory ui-inputs-hash)" >> "$GITHUB_OUTPUT"
      - if: matrix.os == 'ubuntu-latest'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/
          key: test-ui-${{ steps.ui-inputs.outputs.hash }}
      - if: matrix.os == 'ubuntu-latest'
        run: make ci
      # The front end is browser code, identical on every OS: ubuntu runs its suite once, and the
      # macOS leg, which exists for the Go build and tests, skips it.
      - if: matrix.os == 'macos-latest'
        run: make ci CI_EXTRA=
      - if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: cover.out
          if-no-files-found: error
          retention-days: 14

  # scripts/install.sh is published for `curl ... | sh`, so a syntax error or a bashism ships straight to
  # users' shells. `make ci` doesn't cover shell scripts; shellcheck is preinstalled on the ubuntu runners.
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck -s sh scripts/install.sh
