name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # scripts/install.sh is published for `curl ... | sh`, so a syntax error or a
  # bashism ships straight to users' shells. shellcheck is preinstalled on the
  # ubuntu runners, so this costs nothing.
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: shellcheck -s sh scripts/install.sh

  # `make lint` includes `lint-vulncheck` (govulncheck, call-graph aware — only
  # fails on vulnerabilities the code actually reaches), so there is no
  # separate vulncheck job here. It runs once per OS in this matrix rather
  # than once overall; accepted redundancy for reusing setup-go's cache.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: make lint test
      - if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: cover.out
          if-no-files-found: error
          retention-days: 14
